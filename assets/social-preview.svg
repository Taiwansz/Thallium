<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <style>
      .mono-kicker {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #D8B46A;
        font-weight: 600;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 64px;
        font-weight: 800;
        fill: #F5F1E8;
        letter-spacing: -0.5px;
      }
      .brand-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 22px;
        fill: #8E929E;
        line-height: 32px;
      }
      .spec-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        fill: #D8B46A;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      .spec-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        fill: #F5F1E8;
        font-weight: 500;
      }
      .chip-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        fill: #C2C6D1;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="#0D0E12" />
  <rect x="1" y="1" width="1278" height="638" stroke="#1D2028" stroke-width="2" />

  <!-- Accent Vertical Pillar -->
  <rect x="80" y="90" width="4" height="460" rx="2" fill="#D8B46A" />

  <!-- Monogram / Element Identifier (Top Right) -->
  <g transform="translate(1120, 90)">
    <rect width="80" height="80" rx="8" fill="#14161E" stroke="#252936" stroke-width="1.5" />
    <text x="14" y="32" font-family="ui-monospace, monospace" font-size="12" fill="#8E929E" font-weight="600">81</text>
    <text x="40" y="58" font-family="-apple-system, sans-serif" font-size="28" fill="#D8B46A" font-weight="700" text-anchor="middle">Tl</text>
  </g>

  <!-- Content Block -->
  <g transform="translate(115, 140)">
    <!-- Kicker -->
    <text x="0" y="0" class="mono-kicker">CORE BANCÁRIO DIGITAL // LEDGER DE DUPLA ENTRADA</text>

    <!-- Title -->
    <text x="0" y="65" class="brand-title">THALLIUM</text>

    <!-- Description -->
    <text x="0" y="115" class="brand-desc">Infraestrutura bancária transacional com liquidação Pix, cartões virtuais 3D</text>
    <text x="0" y="148" class="brand-desc">e prevenção matemática de saldo negativo via stored procedures atômicas em PostgreSQL.</text>

    <!-- Technical Specs Box -->
    <g transform="translate(0, 195)">
      <rect width="820" height="85" rx="6" fill="#13151D" stroke="#222633" stroke-width="1" />
      <text x="24" y="34" class="spec-label">INVARIANTE CENTRAL DO LEDGER</text>
      <text x="24" y="62" class="spec-val">Saldo não-negativo (S &#8805; 0.00) garantido no nível do banco via PostgreSQL RPCs e Row-Level Security.</text>
    </g>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 315)">
      <text x="0" y="24" class="chip-text">STACK: Next.js 16 &#183; Tailwind CSS v4 &#183; TypeScript &#183; Supabase (Postgres RPCs) &#183; Playwright</text>
    </g>
  </g>
</svg>
